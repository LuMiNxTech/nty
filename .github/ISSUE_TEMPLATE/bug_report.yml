name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. nty ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: nty version
      description: Output of `nty --version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, architecture and terminal
      placeholder: e.g. macOS 26 arm64, iTerm2
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant stderr output. Remove API keys and other secrets first.
      render: text
