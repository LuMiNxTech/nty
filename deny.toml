# cargo-deny configuration. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Fail on any security advisory; unmaintained/yanked crates are reviewed case by case.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with distributing nty under MIT OR Apache-2.0.
# Adding a license here requires a justification in the pull request.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
# Entries are kept for licenses expected from planned dependencies.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
